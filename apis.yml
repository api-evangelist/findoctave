name: Findoctave
description: Findoctave (operating as Octave) is a mental health care provider offering
  virtual and in-person therapy across 20+ U.S. states. Services include individual,
  couples, and family therapy, DBT, and specialized centers of excellence for perinatal
  and postpartum health, LGBTQIA+ (queer resiliency), trauma, and women's emotional
  health. Octave is in-network with major insurers (Aetna, Blue Shield of California,
  BCBS plans, Health Net, and others) and publishes a therapist directory, cost
  calculator, and getting-started flow through its consumer website. Surfaced as a
  portfolio company of Felicis and added to the API Evangelist network; Octave exposes
  no public developer API, so this profile is a company identity record rather than
  an API listing.
